<rect x="30" y="83" width="203" height="93" rx="12" fill="#fff" stroke="#dfe4da"/><text x="47" y="108" font-size="11" fill="#69776a">① 网页输入中文</text><text x="47" y="141" font-size="19" font-weight="600">今天的天气真好。</text>
<rect x="276" y="83" width="203" height="93" rx="12" fill="#fff" stroke="#dfe4da"/><text x="293" y="108" font-size="11" fill="#69776a">② 本机中 → 英模型</text><text x="293" y="141" font-size="19" font-weight="600">It’s a nice day.</text>
<rect x="522" y="83" width="203" height="93" rx="12" fill="#fff" stroke="#dfe4da"/><text x="539" y="108" font-size="11" fill="#69776a">③ 本机英 → TP 模型</text><text x="539" y="141" font-size="17" font-weight="600">ona li tenpo suno pona.</text>
<rect x="768" y="83" width="202" height="93" rx="12" fill="#edf3e4" stroke="#cddbbd"/><text x="785" y="108" font-size="11" fill="#69776a">④ 原 120 词根固定映射</text><text x="785" y="148" font-family="Segoe UI Emoji,Apple Color Emoji,sans-serif" font-size="26">🧍 🔹 ⏰ ☀️ 👍</text>
