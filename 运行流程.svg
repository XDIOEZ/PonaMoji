<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="236" viewBox="0 0 1000 236" role="img" aria-labelledby="title desc">
<title id="title">PonaMoji 本地双模型运行流程</title><desc id="desc">网页提交中文，本机中英模型翻成英文，英 Toki Pona 模型生成 Toki Pona，经原120词根字典转成 Emoji。两个模型文件已保存本机，当前使用 CPU INT8 推理。</desc>
